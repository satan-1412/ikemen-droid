def buildAsLibrary = project.hasProperty('BUILD_AS_LIBRARY');
def buildAsApplication = !buildAsLibrary
if (buildAsApplication) {
    apply plugin: 'com.android.application'
}
else {
    apply plugin: 'com.android.library'
}

android {
    aaptOptions {
        // 【极限修复】：禁止压缩所有引擎相关格式，彻底解决首次运行解压闪退和空文件夹问题！
        noCompress 'txr', 'sff', 'snd', 'def', 'cns', 'st', 'stc', 'cmd', 'mp3', 'ogg', 'wav', 'lua', 'ttf', 'font', 'fnt'
    }
    if (buildAsApplication) {
        namespace "org.ikemen_engine.ikemen_go"
    }
    else {
        namespace "org.libsdl.app"
    }
    compileSdkVersion 34
    
    defaultConfig {
        if (buildAsApplication) {
            applicationId "org.ikemen_engine.ikemen_go"
        }

        minSdkVersion 21
        targetSdkVersion 29
        versionCode 1
        versionName "1.0"
        
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
        resourceConfigurations += ["en", "de", "es", "fr", "ja", "pt", "zh"]
        
        // （已安全移除 C++ 底层 ndkBuild 编译参数）
    }
    
    sourceSets.main {
        assets.srcDirs = ['src/main/assets']
    }
    
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    if (!project.hasProperty('EXCLUDE_NATIVE_LIBS')) {
        sourceSets.main {
            jniLibs.srcDir 'libs'
        }
        
        // （已安全移除 Android.mk 封印解除代码，全面转向 Go）
    }
    
    lint {
        abortOnError false
    }

    if (buildAsLibrary) {
        libraryVariants.all { variant ->
            variant.outputs.each { output ->
                def outputFile = output.outputFile
                if (outputFile != null && outputFile.name.endsWith(".aar")) {
                    def fileName = "org.libsdl.app.aar";
                    output.outputFile = new File(outputFile.parent, fileName);
                }
            }
        }
    }
}

dependencies {
    // 👇 核心修改：让安卓能够读取我们未来用 Go 生成的 .aar 模块包
    implementation fileTree(include: ['*.jar', '*.aar'], dir: 'libs')
}

// =========================================================
// 🚀 极客扩展：构建前自动拉取 3D 引擎离线库和所需字体
// =========================================================
task downloadOfflineAssets {
    doLast {
        // 🛡️ 核心修复 1：直接下载到真实的 assets 目录，保证百分之百被打包进 APK 肚子里！
        def jsDir = file("src/main/assets/js")
        def fontDir = file("src/main/assets/fonts")
        jsDir.mkdirs()
        fontDir.mkdirs()

        // 🛡️ 核心修复 2：全面更换为无防爬虫限制的 unpkg.com，规避云端服务器被 Cloudflare 拦截导致下载到假代码！
        def downloads = [
            "https://unpkg.com/three@0.128.0/build/three.min.js" : new File(jsDir, "three.min.js"),
            "https://unpkg.com/three@0.128.0/examples/js/loaders/GLTFLoader.js" : new File(jsDir, "GLTFLoader.js"),
            "https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js" : new File(jsDir, "OrbitControls.js"),
            "https://unpkg.com/three@0.128.0/examples/js/controls/TransformControls.js" : new File(jsDir, "TransformControls.js"),
            "https://unpkg.com/three@0.128.0/examples/js/exporters/GLTFExporter.js" : new File(jsDir, "GLTFExporter.js"),
            "https://unpkg.com/stats.js@0.17.0/build/stats.min.js" : new File(jsDir, "Stats.min.js"),
            "https://unpkg.com/nipplejs@0.9.0/dist/nipplejs.min.js" : new File(jsDir, "nipplejs.min.js"),
            // 使用 Google Fonts 原始库直链作为 Arial.ttf 的替代品，绝对防损坏！
            "https://raw.githubusercontent.com/googlefonts/roboto/main/src/hinted/Roboto-Regular.ttf" : new File(fontDir, "arial.ttf")
        ]
        
        downloads.each { url, destFile ->
            // 🛡️ 核心修复 3：强制删除旧的报错缓存文件，强制重新下载干净的真文件！打破 GitHub 的缓存死锁！
            if (destFile.exists()) {
                destFile.delete()
            }
            println "Downloading (Forced fresh): " + destFile.name
            ant.get(src: url, dest: destFile)
        }
    }
}

// 将下载任务绑定到 preBuild
preBuild.dependsOn downloadOfflineAssets
