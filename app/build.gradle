def buildAsLibrary = project.hasProperty('BUILD_AS_LIBRARY');
def buildAsApplication = !buildAsLibrary
if (buildAsApplication) {
    apply plugin: 'com.android.application'
}
else {
    apply plugin: 'com.android.library'
}

android {
    aaptOptions {
        // 【极限修复】：禁止压缩所有引擎相关格式，彻底解决首次运行解压闪退和空文件夹问题！
        noCompress 'txr', 'sff', 'snd', 'def', 'cns', 'st', 'stc', 'cmd', 'mp3', 'ogg', 'wav', 'lua', 'ttf', 'font', 'fnt'
    }
    if (buildAsApplication) {
        namespace "org.ikemen_engine.ikemen_go"
    }
    else {
        namespace "org.libsdl.app"
    }
    compileSdkVersion 34
    
    defaultConfig {
        if (buildAsApplication) {
            applicationId "org.ikemen_engine.ikemen_go"
        }

        minSdkVersion 21
        targetSdkVersion 29
        versionCode 1
        versionName "1.0"
        
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
        resourceConfigurations += ["en", "de", "es", "fr", "ja", "pt", "zh"]
        
        // （已安全移除 C++ 底层 ndkBuild 编译参数）
    }
    
    sourceSets.main {
        assets.srcDirs = ['src/main/assets']
    }
    
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    if (!project.hasProperty('EXCLUDE_NATIVE_LIBS')) {
        sourceSets.main {
            jniLibs.srcDir 'libs'
        }
        
        // （已安全移除 Android.mk 封印解除代码，全面转向 Go）
    }
    
    lint {
        abortOnError false
    }

    if (buildAsLibrary) {
        libraryVariants.all { variant ->
            variant.outputs.each { output ->
                def outputFile = output.outputFile
                if (outputFile != null && outputFile.name.endsWith(".aar")) {
                    def fileName = "org.libsdl.app.aar";
                    output.outputFile = new File(outputFile.parent, fileName);
                }
            }
        }
    }
}

dependencies {
    // 👇 核心修改：让安卓能够读取我们未来用 Go 生成的 .aar 模块包
    implementation fileTree(include: ['*.jar', '*.aar'], dir: 'libs')
}

// =========================================================
// 🚀 极客扩展：构建前自动拉取 3D 引擎离线库和所需字体
// =========================================================
task downloadOfflineAssets {
    // 🛡️ 核心修复 1：将文件下载到 Gradle 生成目录，并动态注入 Asset 树，彻底绕过锁定 Bug
    def targetDir = file("${project.buildDir}/generated/offline_assets")
    outputs.dir targetDir
    
    doLast {
        def jsDir = new File(targetDir, "js")
        def fontDir = new File(targetDir, "fonts")
        jsDir.mkdirs()
        fontDir.mkdirs()

        def downloads = [
            "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" : new File(jsDir, "three.min.js"),
            "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js" : new File(jsDir, "GLTFLoader.js"),
            "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js" : new File(jsDir, "OrbitControls.js"),
            "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js" : new File(jsDir, "TransformControls.js"),
            "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/GLTFExporter.js" : new File(jsDir, "GLTFExporter.js"),
            "https://cdnjs.cloudflare.com/ajax/libs/stats.js/r17/Stats.min.js" : new File(jsDir, "Stats.min.js"),
            "https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.9.0/nipplejs.min.js" : new File(jsDir, "nipplejs.min.js"),
            // 🛡️ 核心修复：更换为绝对稳定、支持直链的开源字体源（伪装为arial.ttf，引擎完美识别）
            "https://github.com/googlefonts/roboto/raw/main/src/hinted/Roboto-Regular.ttf" : new File(fontDir, "arial.ttf")
        ]
        
        downloads.each { url, destFile ->
            if (!destFile.exists()) {
                println "Downloading: " + destFile.name
                ant.get(src: url, dest: destFile)
            }
        }
    }
}

// 动态将生成的目录挂载为应用的 Assets 文件夹
android.sourceSets.main.assets.srcDirs += file("${project.buildDir}/generated/offline_assets")
preBuild.dependsOn downloadOfflineAssets
