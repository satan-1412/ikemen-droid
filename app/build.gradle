def buildAsLibrary = project.hasProperty('BUILD_AS_LIBRARY');
def buildAsApplication = !buildAsLibrary
if (buildAsApplication) {
    apply plugin: 'com.android.application'
}
else {
    apply plugin: 'com.android.library'
}

android {
    aaptOptions {
        // 【极限修复】：禁止压缩所有引擎相关格式，彻底解决首次运行解压闪退和空文件夹问题！
        noCompress 'txr', 'sff', 'snd', 'def', 'cns', 'st', 'stc', 'cmd', 'mp3', 'ogg', 'wav', 'lua', 'ttf', 'font', 'fnt'
    }
    if (buildAsApplication) {
        namespace "org.ikemen_engine.ikemen_go"
    }
    else {
        namespace "org.libsdl.app"
    }
    compileSdkVersion 34
    
    defaultConfig {
        if (buildAsApplication) {
            applicationId "org.ikemen_engine.ikemen_go"
        }

        minSdkVersion 21
        targetSdkVersion 29
        versionCode 1
        versionName "1.0"
        
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
        resourceConfigurations += ["en", "de", "es", "fr", "ja", "pt", "zh"]
        
        // 👇 核心修复1：开启 C++ 底层编译参数
        externalNativeBuild {
            ndkBuild {
                arguments "APP_PLATFORM=android-21"
                abiFilters 'armeabi-v7a', 'arm64-v8a'
            }
        }
    }
    
    sourceSets.main {
        assets.srcDirs = ['src/main/assets']
    }
    
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    if (!project.hasProperty('EXCLUDE_NATIVE_LIBS')) {
        sourceSets.main {
            jniLibs.srcDir 'libs'
        }
        
        // 👇 核心修复2：解除封印，正式让安卓去读取并编译底层的 C++ 文件！
        externalNativeBuild {
            ndkBuild {
                path 'jni/Android.mk'
            }
        }
    }
    
    lint {
        abortOnError false
    }

    if (buildAsLibrary) {
        libraryVariants.all { variant ->
            variant.outputs.each { output ->
                def outputFile = output.outputFile
                if (outputFile != null && outputFile.name.endsWith(".aar")) {
                    def fileName = "org.libsdl.app.aar";
                    output.outputFile = new File(outputFile.parent, fileName);
                }
            }
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}
