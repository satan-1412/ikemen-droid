def buildAsLibrary = project.hasProperty('BUILD_AS_LIBRARY');
def buildAsApplication = !buildAsLibrary
if (buildAsApplication) {
    apply plugin: 'com.android.application'
}
else {
    apply plugin: 'com.android.library'
}

android {
    aaptOptions {
        // 【极限修复】：禁止压缩所有引擎相关格式，彻底解决首次运行解压闪退和空文件夹问题！
        noCompress 'txr', 'sff', 'snd', 'def', 'cns', 'st', 'stc', 'cmd', 'mp3', 'ogg', 'wav', 'lua', 'ttf', 'font', 'fnt'
    }
    if (buildAsApplication) {
        namespace "org.ikemen_engine.ikemen_go"
    }
    else {
        namespace "org.libsdl.app"
    }
    compileSdkVersion 34
    
    defaultConfig {
        if (buildAsApplication) {
            applicationId "org.ikemen_engine.ikemen_go"
        }

        minSdkVersion 21
        targetSdkVersion 29
        versionCode 1
        versionName "1.0"
        
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
        resourceConfigurations += ["en", "de", "es", "fr", "ja", "pt", "zh"]
        
        // （已安全移除 C++ 底层 ndkBuild 编译参数）
    }
    
    sourceSets.main {
        assets.srcDirs = ['src/main/assets']
    }
    
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    if (!project.hasProperty('EXCLUDE_NATIVE_LIBS')) {
        sourceSets.main {
            jniLibs.srcDir 'libs'
        }
        
        // （已安全移除 Android.mk 封印解除代码，全面转向 Go）
    }
    
    lint {
        abortOnError false
    }

    if (buildAsLibrary) {
        libraryVariants.all { variant ->
            variant.outputs.each { output ->
                def outputFile = output.outputFile
                if (outputFile != null && outputFile.name.endsWith(".aar")) {
                    def fileName = "org.libsdl.app.aar";
                    output.outputFile = new File(outputFile.parent, fileName);
                }
            }
        }
    }
}

dependencies {
    // 👇 核心修改：让安卓能够读取我们未来用 Go 生成的 .aar 模块包
    implementation fileTree(include: ['*.jar', '*.aar'], dir: 'libs')
}

// =========================================================
// 🚀 极客扩展：构建前自动拉取 3D 引擎离线库 (全格式霸主版)
// =========================================================
task downloadOfflineAssets {
    def targetDir = file("${project.buildDir}/generated/offline_assets")
    outputs.dir targetDir
    
    doLast {
        def jsDir = new File(targetDir, "js")
        def fontDir = new File(targetDir, "fonts")
        jsDir.mkdirs()
        fontDir.mkdirs()

        def downloads = [
            "https://raw.githubusercontent.com/mrdoob/three.js/r128/build/three.min.js" : new File(jsDir, "three.min.js"),
            "https://raw.githubusercontent.com/mrdoob/three.js/r128/examples/js/loaders/GLTFLoader.js" : new File(jsDir, "GLTFLoader.js"),
            "https://raw.githubusercontent.com/mrdoob/three.js/r128/examples/js/loaders/OBJLoader.js" : new File(jsDir, "OBJLoader.js"),
            "https://raw.githubusercontent.com/mrdoob/three.js/r128/examples/js/loaders/FBXLoader.js" : new File(jsDir, "FBXLoader.js"),
            // 👇 这四个是必须补上的核心解析器，否则你加载 3DS、DAE、STL、PLY 时会直接报错！
            "https://raw.githubusercontent.com/mrdoob/three.js/r128/examples/js/loaders/TDSLoader.js" : new File(jsDir, "TDSLoader.js"),
            "https://raw.githubusercontent.com/mrdoob/three.js/r128/examples/js/loaders/ColladaLoader.js" : new File(jsDir, "ColladaLoader.js"),
            "https://raw.githubusercontent.com/mrdoob/three.js/r128/examples/js/loaders/STLLoader.js" : new File(jsDir, "STLLoader.js"),
            "https://raw.githubusercontent.com/mrdoob/three.js/r128/examples/js/loaders/PLYLoader.js" : new File(jsDir, "PLYLoader.js"),
            
            "https://raw.githubusercontent.com/mrdoob/three.js/r128/examples/js/controls/TransformControls.js" : new File(jsDir, "TransformControls.js"),
            "https://raw.githubusercontent.com/mrdoob/three.js/r128/examples/js/exporters/GLTFExporter.js" : new File(jsDir, "GLTFExporter.js"),
            "https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js" : new File(jsDir, "nipplejs.min.js"),
            // 🛡️ 补齐 Draco 极限压缩模型的纯离线解析文件 (JS 与 WASM 核心)
            "https://raw.githubusercontent.com/mrdoob/three.js/r128/examples/js/loaders/DRACOLoader.js" : new File(jsDir, "DRACOLoader.js"),
            "https://raw.githubusercontent.com/mrdoob/three.js/r128/examples/js/libs/draco/gltf/draco_decoder.wasm" : new File(jsDir, "draco_decoder.wasm"),
            "https://raw.githubusercontent.com/mrdoob/three.js/r128/examples/js/libs/draco/gltf/draco_wasm_wrapper.js" : new File(jsDir, "draco_wasm_wrapper.js"),
            "https://raw.githubusercontent.com/mrdoob/three.js/r128/examples/js/libs/draco/gltf/draco_decoder.js" : new File(jsDir, "draco_decoder.js")
        ]
        
        downloads.each { url, destFile ->
            if (destFile.exists()) { destFile.delete() }
            println "Downloading: " + destFile.name
            ant.get(src: url, dest: destFile)
        }
    }
}

android.sourceSets.main.assets.srcDirs += file("${project.buildDir}/generated/offline_assets")
preBuild.dependsOn downloadOfflineAssets
